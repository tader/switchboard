name: Check and publish edge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected release PR head commit
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check dispatched revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix web
      - run: npm run build --prefix web
  image:
    needs: check
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.sha }}
      validated: true
      publish: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

  runtime:
    needs: check
    uses: ./.github/workflows/prepared-runtimes.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: write
