name: Bump version after PR merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          response=$(gh api "repos/$REPOSITORY/commits/$MERGE_SHA/pulls")
          number=$(jq -r --arg sha "$MERGE_SHA" '
            [.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .number]
            | unique
            | if length > 1 then error("Multiple merged PRs for one commit") else .[0] // empty end
          ' <<< "$response")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pr.outputs.number != ''
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Bump and push the patch version
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/bump-version.sh
