name: Docker image
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      stable:
        type: boolean
        default: false
      publish:
        type: boolean
        default: true
      validated:
        description: Caller already validated this exact revision
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or release tag
        required: true
        default: main
      stable:
        description: Publish a released version (tag must match package.json)
        type: boolean
        default: false
      publish:
        description: Push the built image to GHCR
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: source
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      # Direct/release callers still validate the exact tagged tree. The CI
      # caller already did this in its required check job.
      - if: matrix.arch == 'amd64' && !inputs.validated
        run: npm run typecheck && npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: builder
      - name: Choose immutable revision and release tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          STABLE: ${{ inputs.stable }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/image-tags.mjs >> "$GITHUB_OUTPUT"
      - name: Build application once for the native architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: SWITCHBOARD_REVISION=${{ steps.meta.outputs.sha }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: switchboard:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max
      - name: Build updater once for the native architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: updater/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: switchboard-updater:desktop-test
          cache-from: type=gha,scope=updater-${{ matrix.arch }}
          cache-to: type=gha,scope=updater-${{ matrix.arch }},mode=max
      - name: Check application persistence and updater on both architectures
        run: |
          bash .github/scripts/docker-smoke.sh
          docker run --rm --entrypoint node switchboard-updater:desktop-test --input-type=module -e "await import('./updater/engine.ts')"
          docker run --rm --entrypoint docker switchboard-updater:desktop-test --version
          docker run --rm --entrypoint docker switchboard-updater:desktop-test compose version
      - name: Rehearse both managed Compose variants using the same build cache
        if: matrix.arch == 'amd64'
        env:
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          docker tag switchboard:smoke switchboard:desktop-test
          docker build --load --build-arg SWITCHBOARD_REVISION=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb -t switchboard:desktop-candidate .
          python3 scripts/rehearse-compose-manager.py --variant image > "$RUNNER_TEMP/compose-image.log" 2>&1 &
          image_pid=$!
          python3 scripts/rehearse-compose-manager.py --variant source > "$RUNNER_TEMP/compose-source.log" 2>&1 &
          source_pid=$!
          docker tag switchboard:smoke switchboard:polling-test
          docker tag switchboard-updater:desktop-test switchboard-updater:polling-test
          python3 scripts/rehearse-updater-polling.py > "$RUNNER_TEMP/updater-polling.log" 2>&1 &
          polling_pid=$!
          result=0
          for child in "$image_pid" "$source_pid" "$polling_pid"; do wait "$child" || result=1; done
          cat "$RUNNER_TEMP/compose-image.log" "$RUNNER_TEMP/compose-source.log" "$RUNNER_TEMP/updater-polling.log"
          exit "$result"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish != false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Export the tested build graphs from the same local builder. No second
      # platform build, QEMU, or second cache export is needed.
      - name: Push tested application by digest
        if: inputs.publish != false
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          build-args: SWITCHBOARD_REVISION=${{ steps.meta.outputs.sha }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Push tested updater by digest
        if: inputs.publish != false
        id: updater
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: updater/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-updater,push-by-digest=true,name-canonical=true,push=true
      - name: Record matching image digests
        if: inputs.publish != false
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/app" "$RUNNER_TEMP/digests/updater"
          [[ "$APP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$UPDATER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          touch "$RUNNER_TEMP/digests/app/${APP_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/updater/${UPDATER_DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.publish != false
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          retention-days: 1
          overwrite: true
  # Preserve the required "image / build" check. It cannot pass when either
  # architecture, smoke check, Compose rehearsal or publication fails.
  build:
    needs: [source, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docker-tags-${{ inputs.stable && inputs.ref || 'edge' }}
      cancel-in-progress: false
    steps:
      - name: Require every native build and test
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.publish != false
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.publish != false
        with:
          node-version: '24'
          package-manager-cache: false
      - if: inputs.publish != false
        run: npm ci --omit=dev
      - name: Choose release tags at publication time
        if: inputs.publish != false
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          STABLE: ${{ inputs.stable }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/image-tags.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.publish != false
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: inputs.publish != false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.publish != false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble tested multi-platform application and updater manifests
        if: inputs.publish != false
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TAGS: ${{ steps.meta.outputs.tags }}
          DIGESTS: ${{ runner.temp }}/digests
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          STABLE: ${{ inputs.stable }}
        run: bash .github/scripts/publish-image-manifests.sh
