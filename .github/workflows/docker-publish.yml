name: Docker image
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      stable:
        type: boolean
        default: false
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or release tag
        required: true
        default: main
      stable:
        description: Publish a released version (tag must match package.json)
        type: boolean
        default: false
      publish:
        description: Push the built image to GHCR
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ inputs.stable && inputs.ref || 'edge' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Release events created by GITHUB_TOKEN don't start other workflows.
      # release-please calls this workflow directly; validate its exact tagged tree.
      - run: npm ci && npm run typecheck && npm test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Choose immutable revision and release tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          STABLE: ${{ inputs.stable }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/image-tags.mjs >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: switchboard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup and persistent data
        run: bash .github/scripts/docker-smoke.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish != false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
