name: switchboard-dev

networks:
  default: {}
  traefik:
    name: traefik
    external: true

# Mounts the repository: server changes restart the process, plugin changes hot-reload,
# and web changes are rebuilt into web/dist (refresh the browser).
services:
  switchboard-dev:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "npm ci && npm --prefix web ci &&
             (npm --prefix web run watch &) &&
             exec node --disable-warning=ExperimentalWarning --watch-path=server server/main.ts"
    ports:
      - "8771:8770"
    networks:
      - default
      - traefik
    environment:
      SWITCHBOARD_PUBLIC_URL: https://switchboard-dev.example.com
      SWITCHBOARD_DATA_DIR: /app/.data-dev
    volumes:
      - .:/app
      - switchboard-dev-modules:/app/node_modules
      - switchboard-dev-web-modules:/app/web/node_modules
    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      traefik.http.routers.switchboard-dev.entrypoints: websecure
      traefik.http.routers.switchboard-dev.rule: "Host(`switchboard-dev.example.com`)"
      traefik.http.routers.switchboard-dev.tls.certresolver: letsencrypt
      traefik.http.services.switchboard-dev.loadbalancer.server.port: 8770

volumes:
  switchboard-dev-modules:
  switchboard-dev-web-modules:
